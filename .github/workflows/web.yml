name: Web / GitHub Pages
on:
  push:
    branches: [release-web]
  pull_request:
    branches: [release-web]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install graphifyy==0.9.93
      - run: npm ci --prefix tests/pyodide --ignore-scripts
      - run: npx --prefix tests/pyodide playwright-core install --with-deps chromium
      - run: python tools/build_architecture.py
      - run: python web/build.py
      - run: node tests/pyodide/web-architecture.mjs
      - run: node tests/pyodide/web.mjs
      - run: node tests/pyodide/web-world.mjs
      - run: node tests/pyodide/web-current.mjs
      - run: node tests/pyodide/web-evolution.mjs
      - run: node tests/pyodide/web-local-ai.mjs
      - run: node tests/pyodide/web-themes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.ref == 'refs/heads/release-web' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
