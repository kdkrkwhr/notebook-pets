name: Android NoteBuddy
on:
  push:
    branches: [release-android]
    paths: ['android/**', 'web/**', 'anna/bundle/**', 'assets/**', 'engine/**', 'data/**', 'tests/pyodide/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/**', 'anna/bundle/**', 'assets/**', 'engine/**', 'data/**', 'tests/pyodide/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Android packages the hash-locked Anna 1.4.13 source commit.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/pyodide --ignore-scripts
      - name: Verify platform-independent pinned source bytes
        run: python -m unittest discover -s android -p test_package_anna.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify (no model download or AI calls)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Check shared game in mobile browser (mock AI)
        run: |
          npm exec --prefix tests/pyodide -- playwright-core install --with-deps chromium
          node --test tests/pyodide/android-recovery.mjs
          node --test tests/pyodide/android-image-birth.mjs
          node --test tests/pyodide/android-model-verify.mjs
          python -m unittest discover -s tests -p test_birth_traits.py
          node tests/pyodide/android-anna-parity.mjs
          node tests/pyodide/android-anna-render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NoteBuddy-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-verification-reports
          path: |
            android/app/build/reports/
            android/runtime/game-browser/
            android/runtime/image-browser/
            android/runtime/anna-parity/
            android/runtime/anna-render/
