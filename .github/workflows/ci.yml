name: Tests

on:
  push:
  pull_request:
    branches: [develop, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mcp.txt
      - name: Install MCP test dependency
        run: python -m pip install -r requirements-mcp.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Require MCP client before tests
        run: python -c "from mcp import ClientSession; from mcp.client.stdio import stdio_client"
      - name: Run regression and real stdio MCP tests
        run: python -B -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Run engine self-checks
        if: ${{ !cancelled() }}
        run: python -B -X utf8 tests/test_engine.py
