[project]
name = "notebuddy-executa"
version = "0.1.10"
description = "Anna bridge for the existing Notebook Pets Python engine"
requires-python = ">=3.11"
dependencies = ["executa-sdk"]

[project.scripts]
tool-dev-notebuddy = "notebuddy_plugin:main"

[tool.uv.sources]
executa-sdk = { git = "https://github.com/whtcjdtc2007/anna-executa-examples.git", rev = "49749905d443a7e8e7479a8faab39c03c7f16c16", subdirectory = "sdk/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["notebuddy_plugin.py", "game_worker.py", "localization.py", "receipts.py", "privacy.py", "reset.py", "game_core"]
